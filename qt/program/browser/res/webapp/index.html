<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>veQtBrowser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; color: #e94560; }
  .subtitle { color: #888; margin-bottom: 32px; }
  .card {
    background: #16213e; border-radius: 12px; padding: 24px;
    width: 100%; max-width: 720px; margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  .card h2 { font-size: 1rem; color: #e94560; margin-bottom: 12px; }
  #status { color: #0f3460; font-weight: 600; }
  #status.online { color: #4ecca3; }
  #status.offline { color: #e94560; }
  button {
    background: #e94560; color: #fff; border: none;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; margin-right: 8px; margin-top: 8px;
  }
  button:hover { opacity: 0.85; }
  #log {
    background: #0f3460; border-radius: 8px; padding: 12px;
    font-family: monospace; font-size: 0.85rem; color: #aaa;
    max-height: 160px; overflow-y: auto; white-space: pre-wrap;
    margin-top: 12px;
  }
  /* --- tree --- */
  .tree, .tree ul { list-style: none; }
  .tree ul { margin-left: 18px; border-left: 1px solid #1a1a2e; padding-left: 6px; }
  .tree { font-family: monospace; font-size: 0.9rem; max-height: 480px; overflow-y: auto; }
  .tree .row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 4px; border-radius: 4px; cursor: default;
  }
  .tree .row:hover { background: #1a1a2e; }
  .tree .caret {
    width: 14px; flex: none; text-align: center; cursor: pointer;
    color: #e94560; user-select: none; font-size: 0.75rem;
  }
  .tree .caret.leaf { color: #444; cursor: default; }
  .tree .name { color: #4ecca3; flex: none; }
  .tree .name.anon { color: #888; font-style: italic; }
  .tree .val { color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree .val.flash { color: #ffd166; transition: color 0.2s; }
  .tree .badge {
    color: #666; font-size: 0.75rem; flex: none; margin-left: auto;
  }
  .tree .empty { color: #666; font-style: italic; padding: 3px 4px; }
</style>
</head>
<body>

<h1>VersatileEngine Browser</h1>
<p class="subtitle">ve::Node tree - live data viewer</p>

<div class="card">
  <h2>Connection</h2>
  <p>WebSocket: <span id="status" class="offline">Disconnected</span></p>
</div>

<div class="card">
  <h2>Node Tree</h2>
  <ul id="tree" class="tree">
    <li class="empty">Connect to load nodes...</li>
  </ul>
  <button onclick="reloadRoot()">Refresh</button>
  <button onclick="testSet()">Set Test Value</button>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="log"></div>
</div>

<script>
function log(msg) {
  var el = document.getElementById('log');
  el.textContent += new Date().toLocaleTimeString() + '  ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function updateStatus(online) {
  var el = document.getElementById('status');
  el.textContent = online ? 'Connected' : 'Disconnected';
  el.className = online ? 'online' : 'offline';
}

// path -> {span, unwatch}
var watchedLeaves = {};

function fmtValue(v) {
  if (v === undefined) return '';
  var s = JSON.stringify(v);
  return s.length > 80 ? s.slice(0, 77) + '...' : s;
}

function setRowValue(path, value) {
  var entry = watchedLeaves[path];
  if (!entry) return;
  entry.span.textContent = fmtValue(value);
  entry.span.classList.add('flash');
  setTimeout(function() { entry.span.classList.remove('flash'); }, 400);
}

// Watch a leaf node for live value updates
function watchLeaf(path, span) {
  if (watchedLeaves[path]) return;
  var unsub = veService.subscribe(path, function(data) {
    setRowValue(path, data);
  }, { depth: 0 });
  watchedLeaves[path] = { span: span, unwatch: unsub };
}

// Unwatch all leaves under a path prefix (called when collapsing a branch)
function unwatchPrefix(prefix) {
  var toRemove = [];
  for (var p in watchedLeaves) {
    if (p === prefix || p.indexOf(prefix + '/') === 0) {
      toRemove.push(p);
    }
  }
  toRemove.forEach(function(p) {
    if (watchedLeaves[p].unwatch) watchedLeaves[p].unwatch();
    delete watchedLeaves[p];
  });
}

// Unwatch everything (called on reload/disconnect)
function unwatchAll() {
  for (var p in watchedLeaves) {
    if (watchedLeaves[p].unwatch) watchedLeaves[p].unwatch();
  }
  watchedLeaves = {};
}

// One tree row. info comes from children: {name, path, value?, child_count}.
function makeNodeLi(info, value) {
  var li = document.createElement('li');
  var row = document.createElement('div');
  row.className = 'row';

  var caret = document.createElement('span');
  caret.className = 'caret';
  var expandable = info.child_count > 0;
  caret.textContent = expandable ? '▶' : '·';
  if (!expandable) caret.classList.add('leaf');
  row.appendChild(caret);

  var name = document.createElement('span');
  name.className = 'name' + (info.name ? '' : ' anon');
  name.textContent = info.name || info.path.split('/').pop();
  row.appendChild(name);

  var val = document.createElement('span');
  val.className = 'val';
  if (value !== undefined) val.textContent = fmtValue(value);
  row.appendChild(val);

  if (expandable) {
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = info.child_count;
    row.appendChild(badge);
  }

  li.appendChild(row);

  if (expandable) {
    var ul = document.createElement('ul');
    ul.style.display = 'none';
    li.appendChild(ul);
    var loaded = false;
    caret.onclick = function() {
      var open = ul.style.display !== 'none';
      if (open) {
        ul.style.display = 'none';
        caret.textContent = '▶';
        unwatchPrefix(info.path);
        return;
      }
      ul.style.display = '';
      caret.textContent = '▼';
      if (!loaded) {
        loaded = true;
        loadChildren(info.path, ul);
      }
    };
  } else if ('value' in info) {
    // Leaf with value: watch it for live updates
    watchLeaf(info.path, val);
  }

  return li;
}

// Lazy-load one level: children() for structure, export(path,1) for values.
function loadChildren(path, ul) {
  ul.textContent = '';
  Promise.all([
    veService.children(path),
    veService.export(path, 1)
  ]).then(function(results) {
    var children = results[0] || [];
    var tree = results[1];

    var nameCount = {};
    children.forEach(function(c) {
      if (c.name) nameCount[c.name] = (nameCount[c.name] || 0) + 1;
    });

    if (children.length === 0) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '(no children)';
      ul.appendChild(li);
      return;
    }

    children.forEach(function(c) {
      var value;
      if (c.child_count === 0 && ('value' in c) && c.name && nameCount[c.name] === 1
          && tree && typeof tree === 'object' && !Array.isArray(tree)) {
        value = tree[c.name];
      }
      ul.appendChild(makeNodeLi(c, value));
    });
  }).catch(function(err) {
    log('Load ' + (path || '/') + ' failed: ' + err.message);
  });
}

function reloadRoot() {
  if (typeof veService === 'undefined' || !veService.isConnected) {
    log('Not connected');
    return;
  }
  unwatchAll();
  loadChildren('', document.getElementById('tree'));
  log('Tree reloaded');
}

function testSet() {
  if (typeof veService === 'undefined' || !veService.isConnected) {
    log('Not connected');
    return;
  }
  var ts = new Date().toISOString();
  veService.set('browser/test', ts).then(function() {
    log('Set browser/test = ' + ts);
  }).catch(function(err) {
    log('Set failed: ' + err.message);
  });
}

function veServiceCallback(svc) {
  log('veService connected');
  updateStatus(true);
  reloadRoot();
  svc.onConnectionChange(updateStatus);
}
</script>

</body>
</html>
